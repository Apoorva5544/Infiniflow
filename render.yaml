# Render Blueprint — Infiniflow Platform
# Deploys the API, Celery worker, analytics dashboard and React UI as four services.
#
# Secrets live in an Env Group called `infiniflow` (create it in the Render
# dashboard before first deploy). Env Group variables:
#   GROQ_API_KEY=<your Groq key>
#   JWT_SECRET=<long random string>
#   DATABASE_URL=<Neon connection string>
#   REDIS_URL=<Redis connection string>
# Paste those key=value pairs into Dashboard → Env Groups → New — never into
# this file (it would commit the secrets to the repository).
#
# Service URL scheme used elsewhere in this file assumes the default
# `<service-name>.onrender.com` subdomains. Renaming a service changes its URL
# and must be reflected in VITE_API_URL / CORS_ORIGINS.

services:
  # ── FastAPI backend (pgvector on Neon, Redis semantic cache) ──────────────
  - type: web
    name: infiniflow-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main_v2:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VECTOR_STORE
        value: pgvector
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://infiniflow-ui.onrender.com,http://localhost:3000,http://localhost:5173
      - fromGroup: infiniflow

  # ── Celery worker (async ingestion; broker = REDIS_URL) ───────────────────
  - type: worker
    name: infiniflow-celery
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A backend.tasks worker --loglevel=info --concurrency=1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VECTOR_STORE
        value: pgvector
      - fromGroup: infiniflow

  # ── Streamlit admin analytics dashboard ───────────────────────────────────
  - type: web
    name: infiniflow-analytics
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.enableCORS false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VECTOR_STORE
        value: pgvector
      - fromGroup: infiniflow

  # ── React + Vite UI (SPA, built with VITE_API_URL → API service) ──────────
  - type: static-site
    name: infiniflow-ui
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://infiniflow-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html