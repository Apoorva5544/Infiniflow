# Render Blueprint — Infiniflow Platform
# Deploys the API, Celery worker, Streamlit analytics dashboard and React UI.
#
# The `infiniflow` Env Group below is created by Render during Blueprint setup.
# Secret values are NOT stored in this file:
#   - GROQ_API_KEY / DATABASE_URL / REDIS_URL -> you are prompted once
#   - JWT_SECRET -> auto-generated by Render (generateValue)
# After setup you can review/edit them under Dashboard → Env Groups.
#
# Service URL scheme assumes the default `<service-name>.onrender.com`
# subdomains. Renaming a service changes its URL and must be reflected in
# VITE_API_URL / CORS_ORIGINS.

envVarGroups:
  - name: infiniflow
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

services:
  # ── FastAPI backend (pgvector on Neon, Redis semantic cache) ──────────────
  - type: web
    name: infiniflow-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main_v2:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VECTOR_STORE
        value: pgvector
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://infiniflow-ui.onrender.com,http://localhost:3000,http://localhost:5173
      - fromGroup: infiniflow

  # ── Celery worker (async ingestion; broker = REDIS_URL) ───────────────────
  - type: worker
    name: infiniflow-celery
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A backend.tasks worker --loglevel=info --concurrency=1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VECTOR_STORE
        value: pgvector
      - fromGroup: infiniflow

  # ── Streamlit admin analytics dashboard ───────────────────────────────────
  - type: web
    name: infiniflow-analytics
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.enableCORS false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VECTOR_STORE
        value: pgvector
      - fromGroup: infiniflow

  # ── React + Vite UI (SPA, built with VITE_API_URL → API service) ──────────
  - type: web
    name: infiniflow-ui
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://infiniflow-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html