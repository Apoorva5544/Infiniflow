# Render Blueprint — Infiniflow Platform (single-container deployment)
# The multi-stage Dockerfile builds the React UI and ships it inside the
# FastAPI image, which serves it from / (API routes take priority).
#
# The `infiniflow` Env Group is created by Render during Blueprint setup.
# Secret values are NOT stored in this file:
#   - GROQ_API_KEY / DATABASE_URL (Neon) / REDIS_URL -> you are prompted once
#   - JWT_SECRET -> auto-generated by Render (generateValue)
# REDIS_URL may be a Redis Cloud / Upstash URL; the semantic cache and Celery
# broker both read it.

envVarGroups:
  - name: infiniflow
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

services:
  # ── API (FastAPI + served React UI, pgvector on Neon, Redis cache) ─────────
  - type: web
    name: infiniflow-api
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: VECTOR_STORE
        value: pgvector
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:5173
      # Cross-encoder reranking is CPU-heavy and slow under free-tier throttling.
      # The hybrid (vector + BM25) retriever already gives good results; flip to
      # "true" only on a non-throttled plan.
      - key: ENABLE_RERANKER
        value: "false"
      - fromGroup: infiniflow

  # ── Celery worker (async ingestion; broker = REDIS_URL) ────────────────────
  # NOTE: "0.5c-512mb" is a PAID plan. If you are on the free tier only, delete
  # this service in the Render dashboard or it will bill you. Ingestion in
  # main_v2.py currently runs synchronously anyway, so the worker is optional.
  - type: worker
    name: infiniflow-celery
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    dockerCommand: celery -A backend.tasks worker --loglevel=info --concurrency=1
    envVars:
      - key: VECTOR_STORE
        value: pgvector
      - fromGroup: infiniflow

  # ── Streamlit admin analytics dashboard ─────────────────────────────────────
  - type: web
    name: infiniflow-analytics
    runtime: docker
    region: oregon
    plan: free
    dockerCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: VECTOR_STORE
        value: chroma
      - fromGroup: infiniflow