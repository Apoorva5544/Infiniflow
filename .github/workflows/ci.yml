name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend · tests + lint + eval
    runs-on: ubuntu-latest
    env:
      INFINIFLOW_SKIP_RERANKER: "true"   # no model downloads in CI (reranker degrades gracefully)
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff — fatal error classes)
        run: ruff check --select E9,F63,F7,F82 backend ai_engine evals tests rag_engine.py

      - name: Format check (black, new modules)
        run: black --check ai_engine/reranker.py ai_engine/store.py evals tests/test_reranker.py tests/test_redis_cache.py

      - name: Unit tests
        run: python -m pytest tests -q --disable-warnings

      - name: Evaluation smoke test (retrieval metrics)
        run: python -m evals.evaluate --no-generation

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build